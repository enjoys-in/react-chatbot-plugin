  <style>
    /* ── Tokens ───────────────────────────────────────
       The same neutral system the widget ships (see `neutrals()` and
       `motion` in src/styles/theme.ts): one white/near-black surface pair,
       three ink levels, a hairline. Colour carries meaning, not decoration,
       so the page has no accent hue — and it follows the OS the way the
       widget's `mode: 'auto'` does, so page and panel never disagree. */
    :root {
      color-scheme: light dark;

      --page: #FAFAFA;
      --surface: #FFFFFF;
      --ink: #14161A;
      --ink-muted: #6C6F74;
      --ink-faint: #A6A9AD;
      --hairline: rgba(9, 14, 21, 0.08);
      --hairline-strong: rgba(9, 14, 21, 0.18);
      --hover: rgba(9, 14, 21, 0.06);
      --accent: #000000;
      --accent-ink: #FAFAFA;
      --lift: 0 1px 2px rgba(9, 14, 21, 0.04), 0 4px 16px rgba(9, 14, 21, 0.08);

      /* Timings mirror the widget's `motion` tokens. */
      --t-surface: 0.15s ease;
      --t-control: 0.2s ease;
      --t-panel: 0.32s cubic-bezier(0.23, 1, 0.32, 1);

      --shell: 1100px;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial,
              sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }

    /* Surfaces lift with lightness, never with colour. */
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #0F1114;
        --surface: #14161A;
        --ink: #F7F7F7;
        --ink-muted: #9A9DA2;
        --ink-faint: #6E7176;
        --hairline: rgba(255, 255, 255, 0.09);
        --hairline-strong: rgba(255, 255, 255, 0.22);
        --hover: rgba(255, 255, 255, 0.08);
        --accent: #F2F3F5;
        --accent-ink: #14161A;
        --lift: 0 4px 20px rgba(0, 0, 0, 0.5);
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      background: var(--page);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* One ring for every control, instead of the browser default that the
       old pill/card styles effectively hid. */
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .app { min-height: 100vh; display: flex; flex-direction: column; }

    /* ── Header ───────────────────────────────────── */
    .app-header {
      background: var(--page);
      border-bottom: 1px solid var(--hairline);
    }
    .app-header__inner {
      max-width: var(--shell);
      margin: 0 auto;
      display: flex; align-items: center; gap: 16px;
    }
    .app-header__inner--hero {
      flex-direction: column;
      text-align: center;
      padding: 72px 24px 56px;
    }
    .app-header__inner--detail { padding: 24px; }

    .hero-badge {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      padding: 5px 14px;
      font-size: 11px; font-weight: 500;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 24px;
    }

    .app-header__title {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.08;
      color: var(--ink);
    }
    .app-header__inner--detail .app-header__title {
      font-size: 1.375rem;
      letter-spacing: -0.015em;
      display: flex; align-items: center; gap: 8px;
    }
    .app-header__subtitle {
      margin-top: 14px;
      font-size: 1rem;
      line-height: 1.6;
      color: var(--ink-muted);
      max-width: 560px;
    }
    .app-header__inner--detail .app-header__subtitle {
      margin-top: 4px;
      font-size: 13px;
      line-height: 1.42;
    }

    .hero-install {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: 14px;
      padding: 12px 18px;
      margin-top: 28px;
      font-family: var(--mono);
      font-size: 13px;
      color: var(--ink-muted);
    }
    .hero-install .prompt { display: inline-flex; color: var(--ink-faint); }
    .hero-install .pkg { color: var(--ink); font-weight: 500; }

    .hero-chips {
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 6px;
      margin-top: 28px;
      max-width: 620px;
    }
    .chip {
      display: inline-flex; align-items: center;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 12px;
      color: var(--ink-muted);
    }

    .hero-stats {
      display: flex; gap: 40px; margin-top: 36px;
    }
    .hero-stat__value {
      font-size: 20px; font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--ink);
    }
    .hero-stat__label {
      margin-top: 4px;
      font-size: 11px; font-weight: 500;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--ink-faint);
    }

    .back-btn {
      background: var(--surface);
      border: 1px solid var(--hairline);
      color: var(--ink);
      padding: 7px 16px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 13px; font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background var(--t-surface), border-color var(--t-surface);
    }
    .back-btn:hover { background: var(--hover); border-color: var(--hairline-strong); }

    /* ── Main ─────────────────────────────────────── */
    .main {
      flex: 1;
      width: 100%;
      max-width: var(--shell);
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    /* Filter bar */
    .filter-bar {
      display: flex; gap: 8px;
      flex-wrap: wrap; justify-content: center;
      margin-bottom: 40px;
    }
    .filter-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--surface);
      border: 1px solid var(--hairline);
      color: var(--ink-muted);
      padding: 7px 15px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 13px; font-weight: 500;
      cursor: pointer;
      transition: background var(--t-surface), border-color var(--t-surface), color var(--t-surface);
    }
    .filter-btn:hover { color: var(--ink); border-color: var(--hairline-strong); }
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }

    /* Demo grid */
    .demo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 12px;
    }

    .demo-card {
      display: flex; align-items: center; gap: 14px;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: 16px;
      padding: 16px 18px;
      text-align: left;
      font-family: inherit;
      color: inherit;
      cursor: pointer;
      transition: border-color var(--t-surface), box-shadow var(--t-control);
    }
    .demo-card:hover {
      border-color: var(--hairline-strong);
      box-shadow: var(--lift);
    }
    .demo-card__icon {
      flex-shrink: 0;
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      background: var(--hover);
      border-radius: 12px;
      color: var(--ink-muted);
      transition: color var(--t-surface);
    }
    .demo-card:hover .demo-card__icon { color: var(--ink); }
    .demo-card__body { flex: 1; min-width: 0; }
    .demo-card__title {
      font-size: 14px; font-weight: 600;
      line-height: 1.4;
      color: var(--ink);
    }
    .demo-card__desc {
      margin-top: 2px;
      font-size: 13px;
      line-height: 1.42;
      color: var(--ink-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .demo-card__arrow {
      flex-shrink: 0;
      display: flex;
      color: var(--ink-faint);
      transition: color var(--t-surface), transform var(--t-control);
    }
    .demo-card:hover .demo-card__arrow {
      color: var(--ink);
      transform: translateX(2px);
    }

    /* Active demo panel */
    .active-info {
      max-width: 560px;
      margin: 32px auto 0;
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: 16px;
      padding: 28px;
      text-align: center;
      animation: info-enter var(--t-panel);
    }
    .active-info p {
      font-size: 14px; line-height: 1.6;
      color: var(--ink-muted);
    }
    .active-info strong { color: var(--ink); font-weight: 600; }
    .active-info__meta {
      display: flex; gap: 6px;
      justify-content: center; flex-wrap: wrap;
      margin-top: 18px;
    }
    /* Neutral by default — a badge names a feature, it doesn't rank one. */
    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--hover);
      border: 1px solid var(--hairline);
      color: var(--ink-muted);
      font-size: 11px; font-weight: 500;
      letter-spacing: 0.01em;
    }

    @keyframes info-enter {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: none; }
    }

    /* ── Footer ───────────────────────────────────── */
    .demo-footer {
      border-top: 1px solid var(--hairline);
      padding: 20px 24px;
      text-align: center;
      font-size: 12px;
      color: var(--ink-faint);
    }
    .demo-footer a {
      color: var(--ink-muted);
      text-decoration: none;
      transition: color var(--t-surface);
    }
    .demo-footer a:hover { color: var(--ink); text-decoration: underline; }

    @media (max-width: 700px) {
      .demo-grid { grid-template-columns: 1fr; }
      .app-header__inner--hero { padding: 48px 20px 40px; }
      .hero-stats { gap: 24px; }
      .main { padding: 24px 20px 72px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
